name: ArmorPaint Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Prepare build tools
        shell: pwsh
        run: |
          $amake = "base/tools/bin/windows_x64/amake.exe"

          if (!(Test-Path $amake)) {
            throw "Missing $amake"
          }

          Write-Host "Found amake: $amake"

      - name: Generate Visual Studio solution
        shell: bash
        run: |
          export IRON_PLATFORM=windows_x64
          cd paint
          ../base/make

      - name: Verify solution
        shell: pwsh
        run: |
          $sln = "paint/build/ArmorPaint.sln"

          if (!(Test-Path $sln)) {
            Get-ChildItem paint/build -Recurse -ErrorAction SilentlyContinue |
              Select-Object FullName
            throw "ArmorPaint.sln was not generated"
          }

      - name: Build solution
        shell: pwsh
        run: |
          msbuild paint/build/ArmorPaint.sln `
            /m `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /verbosity:minimal

      - name: Verify output
        shell: pwsh
        run: |
          $out = "paint/build/out"

          if (!(Test-Path $out)) {
            New-Item -ItemType Directory -Path $out -Force | Out-Null
          }

          Get-ChildItem paint/build -Filter ArmorPaint.exe -Recurse |
            Select-Object FullName, Length

          Get-ChildItem $out -Recurse -File |
            Select-Object FullName, Length

      - name: Upload complete output folder
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-out
          path: paint/build/out/
          if-no-files-found: error
          retention-days: 14
