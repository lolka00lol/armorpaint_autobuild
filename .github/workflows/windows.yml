name: ArmorPaint Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Prepare build tools
        shell: pwsh
        run: |
          $amake = "base/tools/bin/windows_x64/amake.exe"

          if (!(Test-Path $amake)) {
            throw "Missing $amake"
          }

          Write-Host "Found amake: $amake"

      - name: Generate Visual Studio solution
        shell: bash
        run: |
          export IRON_PLATFORM=windows_x64
          cd paint
          ../base/make

      - name: Find and build ArmorPaint solution
        shell: pwsh
        run: |
          $solutions = @(
            Get-ChildItem -Path . -Filter "ArmorPaint.sln" -File -Recurse |
              Where-Object { $_.FullName -notmatch '\\.git\\' }
          )

          if ($solutions.Count -eq 0) {
            Write-Host "No ArmorPaint.sln found. Build directory contents:"
            if (Test-Path "paint/build") {
              Get-ChildItem "paint/build" -Recurse |
                Select-Object FullName
            }

            Write-Host "All generated solution and project files:"
            Get-ChildItem -Path . -Recurse -File |
              Where-Object {
                $_.Extension -in @(".sln", ".vcxproj", ".props")
              } |
              Select-Object -First 100 FullName

            throw "ArmorPaint.sln was not generated."
          }

          $sln = $solutions[0].FullName
          Write-Host "Building solution: $sln"

          msbuild "$sln" `
            /m `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }

      - name: Verify output
        shell: pwsh
        run: |
          $out = "paint/build/out"

          if (!(Test-Path $out)) {
            New-Item -ItemType Directory -Path $out -Force | Out-Null
          }

          Get-ChildItem paint/build -Filter ArmorPaint.exe -Recurse |
            Select-Object FullName, Length

          Get-ChildItem $out -Recurse -File |
            Select-Object FullName, Length

      - name: Upload complete output folder
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-out
          path: paint/build/out/
          if-no-files-found: error
          retention-days: 14
