name: ArmorPaint Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Prepare build tools
        shell: pwsh
        run: |
          $amake = "base/tools/bin/windows_x64/amake.exe"

          if (!(Test-Path $amake)) {
            throw "Missing $amake"
          }

          Write-Host "Found amake: $amake"

      - name: Generate Visual Studio solution
        shell: bash
        run: |
          export IRON_PLATFORM=windows_x64
          cd paint
          ../base/make

      - name: Find and build ArmorPaint solution
        shell: pwsh
        run: |
          $solutions = @(
            Get-ChildItem -Path . -Recurse -File -Filter "*.sln" |
              Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' }
          )

          if ($solutions.Count -eq 0) {
            Write-Host "No .sln found. Generated files:"
            Get-ChildItem paint/build -Recurse -File -ErrorAction SilentlyContinue |
              Select-Object FullName

            Write-Host "Other Visual Studio project files:"
            Get-ChildItem . -Recurse -File -Include "*.vcxproj","*.slnx" |
              Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' } |
              Select-Object FullName

            throw "No Visual Studio solution found in repository."
          }

          $solutions | Select-Object FullName

          $sln = $solutions |
            Where-Object { $_.Name -eq "ArmorPaint.sln" } |
            Select-Object -First 1

          if ($null -eq $sln) {
            $sln = $solutions[0]
          }

          Write-Host "Building solution: $($sln.FullName)"

          & msbuild $sln.FullName `
            /m `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }

      - name: Verify output
        shell: pwsh
        run: |
          $out = "paint/build/out"

          if (!(Test-Path $out)) {
            New-Item -ItemType Directory -Path $out -Force | Out-Null
          }

          Get-ChildItem paint/build -Filter ArmorPaint.exe -Recurse |
            Select-Object FullName, Length

          Get-ChildItem $out -Recurse -File |
            Select-Object FullName, Length

      - name: Upload complete output folder
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-out
          path: paint/build/out/
          if-no-files-found: error
          retention-days: 14
