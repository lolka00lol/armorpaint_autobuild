name: ArmorPaint Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Prepare build tools
        shell: pwsh
        run: |
          $amake = "base/tools/bin/windows_x64/amake.exe"

          if (!(Test-Path $amake)) {
            throw "Missing $amake"
          }

          Write-Host "Found amake: $amake"

      - name: Generate Visual Studio solution
        shell: bash
        run: |
          export IRON_PLATFORM=windows_x64
          cd paint
          ../base/make

      - name: Diagnose generated Visual Studio files
        shell: pwsh
        run: |
          Write-Host "Workspace: $PWD"

          foreach ($dir in @("paint", "paint/build", "build")) {
            Write-Host "`n--- $dir ---"
            if (Test-Path $dir) {
              Get-ChildItem $dir -Force |
                Select-Object Name, Mode, Length
            }
            else {
              Write-Host "Directory does not exist"
            }
          }

          Write-Host "`n--- All generated Visual Studio files ---"

          $files = Get-ChildItem -Path $PWD -Recurse -File |
            Where-Object {
              $_.Extension -in @(".sln", ".slnx", ".vcxproj")
            }

          if ($files) {
            $files | Select-Object FullName, Length
          }
          else {
            Write-Host "No .sln, .slnx or .vcxproj files found."
          }

      - name: Verify output
        shell: pwsh
        run: |
          $out = "paint/build/out"

          if (!(Test-Path $out)) {
            New-Item -ItemType Directory -Path $out -Force | Out-Null
          }

          Get-ChildItem paint/build -Filter ArmorPaint.exe -Recurse |
            Select-Object FullName, Length

          Get-ChildItem $out -Recurse -File |
            Select-Object FullName, Length

      - name: Upload complete output folder
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-out
          path: paint/build/out/
          if-no-files-found: error
          retention-days: 14
