name: Cross-Platform Build & Release

on:
  workflow_dispatch: # Добавляет кнопку ручного запуска в панели GitHub Actions
    inputs:
      release_version:
        description: 'Имя версии для релиза (например: v1.0.0 или Test-Build)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: armorpaint-windows
            build_path: paint/build/build/Release/
          - os: ubuntu-latest
            artifact_name: armorpaint-linux
            build_path: paint/build/build/Release/
          - os: macos-latest
            artifact_name: armorpaint-macos
            build_path: paint/build/build/Release/

    steps:
    - uses: actions/checkout@v4

    # --- ЗАВИСИМОСТИ ДЛЯ LINUX ---
    - name: Install Linux Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt install make clang libvulkan-dev libgtk-3-dev libasound2-dev --yes --quiet

    # --- КОМПИЛЯЦИЯ ПРОЕКТА ---
    - name: Compile
      run: |
        cd paint
        ../base/make --compile

    # --- СБОРКА ПОЛНОЦЕННЫХ РАБОЧИХ РЕЛИЗОВ С АССЕТАМИ (DATA) ---
    - name: Package Artifacts
      run: |
        # Создаем чистую временную папку для финального билда
        mkdir -p ${{ github.workspace }}/dist_stage

        set -euo pipefail

        TARGET_ZIP="$GITHUB_WORKSPACE/${{ matrix.artifact_name }}.tar.gz"
        STAGE="$GITHUB_WORKSPACE/dist_stage"
        
        rm -rf "$STAGE"
        mkdir -p "$STAGE"
        
        test -d "$STAGE"
        echo "Staging directory: $STAGE"
        
        # Функция автоматического поиска и копирования папки data
        copy_data_folder() {
          DATA_PATH=$(find ${{ github.workspace }} -type d -name "data" -not -path "*/.git*" -not -path "*/build*" | head -n 1)
          if [ -n "$DATA_PATH" ]; then
            echo "Found data folder at: $DATA_PATH"
            cp -r "$DATA_PATH" "${{ github.workspace }}/dist_stage/"
          else
            # Альтернативный поиск, если папка зашита в другом месте
            cp -r paint/data ${{ github.workspace }}/dist_stage/ 2>/dev/null || true
          fi
        }

        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          set -euo pipefail
        
          EXE_DIR="paint/build/out"
          STAGE="$GITHUB_WORKSPACE/dist_stage"
        
          test -f "$EXE_DIR/ArmorPaint.exe" || {
            echo "ERROR: ArmorPaint.exe not found in $EXE_DIR"
            exit 1
          }
        
          test -d "$EXE_DIR/data" || {
            echo "ERROR: Required data directory not found in $EXE_DIR"
            exit 1
          }
        
          mkdir -p "$STAGE"
        
          cp "$EXE_DIR/ArmorPaint.exe" "$STAGE/"
          cp -a "$EXE_DIR/data" "$STAGE/"
        
          echo "=== Package contents ==="
          find "$STAGE" -type f -printf '%P (%s bytes)\n'
        
          echo "=== Create archive ==="
          tar --force-local -czf "$TARGET_ZIP" -C "$STAGE" .
        
          echo "=== Archive size ==="
          ls -lh "$TARGET_ZIP"
          
        elif [ "${{ matrix.os }}" = "macos-latest" ]; then
          # На Mac ресурсы уже вшиты внутри бандла ArmorPaint.app/Contents/Resources
          cd paint/build/build/Release/
          tar -czf "$TARGET_ZIP" ArmorPaint.app
          
        else
          # Linux сборка
          # 1. Находим и копируем бинарник
          LINUX_BIN=$(find paint/build -type f -name "ArmorPaint" ! -name "*.c" ! -name "*.h" ! -name "*.d" ! -name "*.o" | head -n 1)
          if [ -z "$LINUX_BIN" ]; then
            LINUX_BIN=$(find . -maxdepth 3 -type f -name "ArmorPaint" ! -name "*.c" ! -name "*.h" ! -name "*.d" ! -name "*.o" | head -n 1)
          fi
          
          if [ -n "$LINUX_BIN" ]; then
            cp "$LINUX_BIN" ${{ github.workspace }}/dist_stage/
          else
            echo "Error: Linux build artifact not found!" && exit 1
          fi
          
          # 2. Ищем и копируем папку data
          copy_data_folder
          
          cd ${{ github.workspace }}/dist_stage
          tar -czf "$TARGET_ZIP" ./*
        fi
      shell: bash

    # --- ВРЕМЕННОЕ СОХРАНЕНИЕ НА GITHUB ---
    - name: Upload temporary artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_name }}.tar.gz
        retention-days: 1

  # --- ОДИН ШАГ ДЛЯ СОЗДАНИЯ РЕЛИЗА ДЛЯ ВСЕХ СИСТЕМ ОДНОВРЕМЕННО ---
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        merge-multiple: true # Скачает все три архива в одну текущую папку

    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: armorpaint-*.tar.gz
        tag: ${{ github.event.inputs.release_version }}
        overwrite: true
        file_glob: true
