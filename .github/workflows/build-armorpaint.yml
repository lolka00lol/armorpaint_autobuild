name: Cross-Platform Build & Release

on:
  workflow_dispatch: # Добавляет кнопку ручного запуска в панели GitHub Actions
    inputs:
      release_version:
        description: 'Имя версии для релиза (например: v1.0.0 или Test-Build)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: armorpaint-windows
            build_path: paint/build/build/Release/
          - os: ubuntu-latest
            artifact_name: armorpaint-linux
            build_path: paint/build/build/Release/
          - os: macos-latest
            artifact_name: armorpaint-macos
            build_path: paint/build/build/Release/

    steps:
    - uses: actions/checkout@v4

    # --- ЗАВИСИМОСТИ ДЛЯ LINUX ---
    - name: Install Linux Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt install make clang libvulkan-dev libgtk-3-dev libasound2-dev --yes --quiet

    # --- КОМПИЛЯЦИЯ ПРОЕКТА ---
    - name: Compile
      run: |
        cd paint
        ../base/make --compile

    # --- НАДЕЖНОЕ АВТО-УПАКОВЫВАНИЕ (БЕЗ ОШИБОК С ПУТЯМИ) ---
    - name: Package Artifacts
      run: |
        # Используем абсолютный путь воркспейса для сохранения архива
        TARGET_ZIP="${{ github.workspace }}/${{ matrix.artifact_name }}.tar.gz"
        
        # Переходим в точную папку билда, которая настроена в матрице сверху
        cd ${{ matrix.build_path }}
        
        # Пакуем всё содержимое этой папки
        tar -czf "$TARGET_ZIP" ./*
      shell: bash

    # --- ВРЕМЕННОЕ СОХРАНЕНИЕ НА GITHUB ---
    - name: Upload temporary artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_name }}.tar.gz
        retid-days: 1

  # --- ОДИН ШАГ ДЛЯ СОЗДАНИЯ РЕЛИЗА ДЛЯ ВСЕХ СИСТЕМ ОДНОВРЕМЕННО ---
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        merge-multiple: true # Скачает все три архива в одну текущую папку

    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: armorpaint-*.tar.gz
        tag: ${{ github.event.inputs.release_version }}
        overwrite: true
        file_glob: true
