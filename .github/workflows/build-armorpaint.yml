name: Cross-Platform Build & Release

on:
  workflow_dispatch: # Добавляет кнопку ручного запуска в панели GitHub Actions
    inputs:
      release_version:
        description: 'Имя версии для релиза (например: v1.0.0 или Test-Build)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: armorpaint-windows
            build_path: paint/build/build/Release/
          - os: ubuntu-latest
            artifact_name: armorpaint-linux
            build_path: paint/build/build/Release/
          - os: macos-latest
            artifact_name: armorpaint-macos
            build_path: paint/build/build/Release/

    steps:
    - uses: actions/checkout@v4

    # --- ЗАВИСИМОСТИ ДЛЯ LINUX ---
    - name: Install Linux Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt install make clang libvulkan-dev libgtk-3-dev libasound2-dev --yes --quiet

    # --- КОМПИЛЯЦИЯ ПРОЕКТА ---
    - name: Compile
      run: |
        cd paint
        ../base/make --compile

    # --- НАДЕЖНОЕ АВТО-УПАКОВЫВАНИЕ ДЛЯ ВСЕХ ОС ---
    - name: Package Artifacts
      run: |
        TARGET_ZIP="${{ github.workspace }}/${{ matrix.artifact_name }}.tar.gz"
        
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          # На Windows рекурсивно ищем скомпилированный ArmorPaint.exe
          EXE_PATH=$(find . -name "ArmorPaint.exe" -o -name "*.exe" | head -n 1)
          if [ -n "$EXE_PATH" ]; then
            cd $(dirname "$EXE_PATH")
            # Флаг --force-local решает проблему с двоеточием в путях на Windows
            tar --force-local -czf "$TARGET_ZIP" $(basename "$EXE_PATH")
          else
            echo "Error: Windows build artifact not found!" && exit 1
          fi
          
        elif [ "${{ matrix.os }}" = "macos-latest" ]; then
          # На Mac архивируем Xcode-сборку ArmorPaint.app
          cd paint/build/build/Release/
          tar -czf "$TARGET_ZIP" ArmorPaint.app
          
        else
          # На Linux ищем исполняемый файл ArmorPaint
          LINUX_BIN=$(find . -maxdepth 6 -type f -name "ArmorPaint" ! -name "*.c" ! -name "*.h" | head -n 1)
          if [ -n "$LINUX_BIN" ]; then
            cd $(dirname "$LINUX_BIN")
            tar -czf "$TARGET_ZIP" $(basename "$LINUX_BIN")
          else
            cd paint/build/build/Release/ 2>/dev/null || cd paint
            tar -czf "$TARGET_ZIP" ArmorPaint || echo "Fallback packaging"
          fi
        fi
      shell: bash

    # --- ВРЕМЕННОЕ СОХРАНЕНИЕ НА GITHUB ---
    - name: Upload temporary artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_name }}.tar.gz
        retid-days: 1

  # --- ОДИН ШАГ ДЛЯ СОЗДАНИЯ РЕЛИЗА ДЛЯ ВСЕХ СИСТЕМ ОДНОВРЕМЕННО ---
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        merge-multiple: true # Скачает все три архива в одну текущую папку

    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: armorpaint-*.tar.gz
        tag: ${{ github.event.inputs.release_version }}
        overwrite: true
        file_glob: true
