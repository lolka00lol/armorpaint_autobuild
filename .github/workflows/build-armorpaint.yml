name: Cross-Platform Build & Release

on:
  workflow_dispatch: # Добавляет кнопку ручного запуска в панели GitHub Actions
    inputs:
      release_version:
        description: 'Имя версии для релиза (например: v1.0.0 или Test-Build)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Если одна ОС упадет, остальные продолжат собираться
      matrix:
        # Объединяем все три операционные системы
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    # --- НАСТРОЙКА ЗАВИСИМОСТЕЙ ДЛЯ LINUX ---
    - name: Install Linux Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt install make clang libvulkan-dev libgtk-3-dev libasound2-dev --yes --quiet

    # --- НАСТРОЙКА ЗАВИСИМОСТЕЙ ДЛЯ MACOS (Если нужны) ---
    # По умолчанию macOS уже идет с установленным clang и make. 
    # Если вашему движку на Mac нужен Vulkan SDK, раскомментируйте строки ниже:
    # - name: Install macOS Dependencies
    #   if: matrix.os == 'macos-latest'
    #   run: brew install vulkan-loader

    # --- УНИВЕРСАЛЬНЫЙ ШАГ СБОРКИ ---
    - name: Compile
      run: |
        cd paint
        ../base/make --compile

    # --- ПОДГОТОВКА АРХИВОВ ДЛЯ РЕЛИЗА (Только при пуше тега) ---
    - name: Package Artifacts
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        cd paint
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          tar -czf ../armorpaint-windows.tar.gz *.exe 
        elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          tar -czf ../armorpaint-linux.tar.gz armorpaint
        elif [ "${{ matrix.os }}" = "macos-latest" ]; then
          tar -czf ../armorpaint-macos.tar.gz armorpaint
        fi
      shell: bash

    # --- АВТОМАТИЧЕСКИЙ РЕЛИЗ НА GITHUB (Только при пуше тега) ---
    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: armorpaint-*.tar.gz
        tag: ${{ github.event.inputs.release_version }}
        overwrite: true
        file_glob: true
